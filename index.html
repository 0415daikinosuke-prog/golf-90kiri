<style>

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;padding-inline:16px;padding-block:20px 48px}

.brand{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}

/* start */
.hero{display:flex;flex-direction:column;gap:16px;padding-block:12px 4px}

.facts span{font-size:12px;color:var(--muted)}
.gets{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}

.row .v{font-family:var(--f-num);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.sc-foot{padding:10px 20px;font-size:12px;color:var(--muted);background:var(--turf-tint)}

.block{display:flex;flex-direction:column;gap:12px}
.block h2{font-size:18px;font-weight:700}
.top3{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.top3 li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--flag-tint)}
.top3 .n{font-family:var(--f-display);font-size:22px;color:var(--flag);width:24px;text-align:center}

.type{padding:20px;border-radius:18px;background:var(--turf);color:var(--on-turf);display:flex;flex-direction:column;gap:10px}

.type h3{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.3}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--warn);color:var(--warn);font-weight:700}

.action{border-left:4px solid var(--turf);padding:4px 0 4px 16px;display:flex;flex-direction:column;gap:10px}
.action ol{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px;font-weight:700}
.cta{padding:20px;border:2px solid var(--line-green);border-radius:18px;display:flex;flex-direction:column;gap:12px;background:var(--card)}

.cta ul{margin:0;padding-left:1.2em;font-size:15px}
.share{font-size:13px;color:var(--muted);text-align:center}
.divider{height:1px;background:var(--rule)}
@media (prefers-reduced-motion:no-preference){
  .screen{animation:in .25s ease-out}
  @keyframes in{from{transform:translateY(6px)}to{transform:none}}
  .bar i{transition:width .6s ease-out}
}
</style>

<script>
/* ============================================================
   設定（ここだけ書き換えればOK）
   ============================================================ */
const CONFIG = {
  instagram: "daiki_coaching_golf",
  // 結果タイプごとのLINE（Lステップ流入経路）URL。
  // Lステップで流入経路を6つ作り、それぞれ「タグ付与＋結果テンプレート送信」を設定して、そのURLを貼る。

    practice: "", // 打ちっぱなし優等生型
    self: "",     // 感覚ゴルファー型
    judge: "",    // 攻めすぎゴルファー型
    short: "",    // グリーン周り迷子型
    course: ""    // 練習場シングル型
  }
};

/* ---------- 6領域と重み（総合100点の計算用。ユーザーには見せない） ---------- */
const DOMAINS = [
  {id:"shot",     name:"ショット再現力",     w:.25},
  {id:"short",    name:"ショートゲーム力",   w:.20},
  {id:"practice", name:"練習設計力",         w:.17},
  {id:"self",     name:"自己理解力",         w:.15},

/* ---------- 9問（d = 加点先の領域、p = A〜Eの点数） ---------- */
const Q = [
  {d:"shot", t:"ラウンド中のショットで、一番近い状態は？", p:[10,8,4,1], c:[
    "大きなダフリ・トップ・左右への大ミスはかなり少ない",

  {d:"self", t:"自分の基本的な球筋と、ミスしやすい方向を説明できますか？", p:[10,8,4,1], c:[
    "基本球筋も、クラブごとの主なミス方向も把握している",
    "基本球筋と、大まかなミス方向なら分かる",
    "なんとなく分かるが、日によってかなり変わる",
    "ほとんど分からない"]},
  {d:"self", t:"自分のクラブの飛距離をどのくらい把握していますか？", p:[10,8,4,1], c:[
    "ほぼ全番手のキャリーとトータルを把握している",
    "主要な番手のキャリーは把握している",
    "だいたいの飛距離だけ把握している",
    "ほとんど把握していない"]},
  {d:"course", t:"傾斜やラフから打つとき、一番近いのは？", p:[10,8,4,1], c:[
    "ライを見て、出やすい球・ミス・飛距離の変化まで予測する",
    "基本的な傾斜やラフなら、ある程度対応できる",
    "打ち方は知っているが、コースでは対応できないことが多い",
    "平らな場所とほぼ同じ感覚で打っている"]},
  {d:"short", t:"直近3ラウンドの平均パット数は？", p:[10,8,5,2,3], c:[
    "32以下","33〜36","37〜40","41以上","分からない・記録していない"]},
  {d:"short", t:"30・50・70yd前後の距離をどう打っていますか？", p:[10,8,4,1], c:[
    "距離ごとに自分なりの基準があり、打ち分けられる",
    "大まかな距離なら打ち分けられる",
    "振り幅は意識するが、距離が安定しない",
    "ほぼ感覚で打っている"]},
  {d:"judge", t:"グリーン右に池、ピンは右奥。普段ならどこを狙いますか？", p:[10,8,4,1], c:[
    "自分の球筋・ミス幅を考えて、安全に残せる場所",
    "基本的にグリーンセンター",
    "池を避けながら、できるだけピン寄り",
    "基本的にピン方向"]},
  {d:"practice", t:"普段の練習で、一番近いものは？", p:[10,8,4,1], c:[
    "前回のラウンドから課題を決め、コースを想定して練習する",
    "その日の課題を決めてから練習する",
    "YouTubeなどで気になった内容を試すことが多い",
    "とりあえず球を打ちながら調子を確認することが多い"]},
  {d:"course", t:"練習場では打てるのに、コースで同じ球が出ない日はどうしますか？", p:[10,8,4,1], c:[
    "その日の球筋・ライ・ミス傾向を見て、攻略を変える",
    "原因を確認して、小さく調整しながらプレーする",
    "練習場のスイングに戻そうと、打ち方を修正する",
    "何が悪いのか分からなくなり、いろいろ試す"]}
];

/* ---------- サブタグ（回答した瞬間に付くもの） ---------- */
const SUBTAGS = [
  {q:6, when:[2,3], name:"攻めすぎ傾向",     note:"ピンを狙う意識が強く、1回のミスで大きく打数を失いやすい傾向です。"},
  {q:7, when:[2],   name:"情報迷子傾向",     note:"試す情報が多く、自分に必要な練習が絞れていない可能性があります。"},
  {q:7, when:[3],   name:"目的なし練習傾向", note:"練習の目的が決まっておらず、球数のわりにスコアにつながりにくい状態です。"},
  {q:8, when:[2,3], name:"コース対応要注意", note:"コースで崩れたとき、スイングで立て直そうとして傷口を広げやすい傾向です。"},
  {q:2, when:[2,3], name:"飛距離把握不足",   note:"番手ごとの距離があいまいだと、狙いが合っていても届かない・オーバーが起きます。"},
  {q:4, when:[4],   name:"パット数未把握",   note:"パット数が分かると、グリーン上で何打失っているかがはっきりします。"}
];

/* ---------- タイプ ---------- */
const TYPES = {
  reach:{name:"👑 90切りリーチ型", body:"大きな穴がなく、どの領域も一定のレベルにあります。ここからは新しい技術を足すより、1ラウンドで何となく失っている2〜3打を拾えるかどうかが90切りの分かれ目です。",
    first:["ダボ以上を打ったホール","そのホールで最初にミスしたショット","ミスの原因（技術・判断・ライ）"],
    firstLead:"次のラウンドで、この3つだけ記録してみてください。", firstTail:"原因が一番多かったものが、次に練習する1つです。"},
  judge:{name:"🔥 攻めすぎゴルファー型", body:"打てる技術はあるのに、狙う場所の選び方で打数を失っているタイプです。ピンを狙った1打が池やバンカーにつかまり、ダボ・トリにつながる。スイングを変えなくても、狙いを変えるだけで縮まる打数があります。",
    first:["ピンを直接狙ったショットの数","そのうちグリーンを外した数","外したあとにかかった打数"],
    firstLead:"次のラウンドで、この3つだけ記録してみてください。", firstTail:"「攻めた結果、何打得して何打失ったか」が見えると、狙いどころが自然に変わります。"},
  short:{name:"⛳ グリーン周り迷子型", body:"ティーショットやセカンドはそこそこ前に進むのに、グリーン周りで打数が積み上がっているタイプです。100yd以内で「3打かかっていたところを2打にする」だけで、90切りはぐっと近づきます。",
    first:["パット数","100yd以内から上がるまでの打数","3パットの回数"],
    firstLead:"次のラウンドで、この3つだけ記録してみてください。", firstTail:"ショットよりグリーン周りのほうが、短い期間で打数を減らしやすい領域です。"},
  practice:{name:"🔄 打ちっぱなし優等生型", body:"練習には通っているのに、その練習がラウンドの打数につながりきっていない状態です。球数を増やすより、練習の順番と目的を変えるほうが結果が出やすいタイプです。",
    first:["一番打数を失ったホール","その原因になったショット","次の練習で試すこと1つ"],
    firstLead:"次のラウンドのあと、この3つだけメモしてみてください。", firstTail:"練習の半分を、そのメモに書いた1つだけに使ってみてください。"},
  self:{name:"🧭 感覚ゴルファー型", body:"「なんとなく打てる」一方で、自分の飛距離・ミス傾向・ラウンドで失っている打数がまだ整理されていない状態です。ここを整理すると、一気に練習の優先順位が見えてくる可能性があります。",
    first:["番手別の実際の距離","ミスした方向","パット数"],
    firstLead:"次のラウンドで、この3つだけ記録してみてください。", firstTail:"スイングを直す前に、まず「自分がどこで打数を失っているか」を知るところからです。"},
  course:{name:"🏌️ 練習場シングル型", body:"練習場ではシングル並みにいい球が打てるのに、コースに出ると別人のようになるタイプです。原因は技術より、傾斜・ラフ・1球勝負といった「練習場にない条件」への慣れにある可能性が高いです。",
    first:["傾斜・ラフから打った回数","そのうちミスになった回数","崩れた後に打ち方を変えたかどうか"],
    firstLead:"次のラウンドで、この3つだけ記録してみてください。", firstTail:"練習場では、1球ごとにクラブと狙いを変える「ラウンド想定」の打ち方を取り入れるのがおすすめです。"}
};
// Lステップのテンプレートと1対1で対応：
// タイプ → 「診断結果｜◯◯型」、 advice → 「個別アドバイス｜◯◯・要改善」
const TYPE_BY_DOMAIN = {short:"short", practice:"practice", self:"self", course:"course", judge:"judge"};
const ADVICE = {
  reach:"90切りリーチ型", short:"ショートゲーム力", judge:"判断力",
  self:"自己理解力", practice:"練習設計力", course:"実戦対応力"
};
const SHOT_TAG = {name:"大ミス要注意", note:"一番低いのはショット再現力でした。大きなミスを1つ減らすだけでも、スコアは目に見えて変わります。"};

function zoneOf(s){
  if(s>=80) return "🟢 90切りリーチゾーン";
  if(s>=65) return "🟡 あと一歩ゾーン";
  if(s>=50) return "🔍 弱点整理ゾーン";
  return "🧱 土台づくりゾーン";
}

/* ---------- 採点 ---------- */
function score(ans){
  const sum={}, max={};
  DOMAINS.forEach(d=>{sum[d.id]=0;max[d.id]=0});
  Q.forEach((q,i)=>{ sum[q.d]+=q.p[ans[i]]; max[q.d]+=10; });
  const dom = DOMAINS.map(d=>({...d, v:Math.round(sum[d.id]/max[d.id]*100)}));
  const total = Math.round(dom.reduce((a,d)=>a+d.v*d.w,0));
  // 低い順。同点なら重みが大きい（=スコアへの影響が大きい）方を優先
  const asc = [...dom].sort((a,b)=>a.v-b.v || b.w-a.w);
  const top3 = asc.slice(0,3);
  const tags = SUBTAGS.filter(t=>t.when.includes(ans[t.q]));
  let type;
  if(total>=80 && dom.every(d=>d.v>=50)) type="reach";
  else {
    let low = asc[0];
    // ショット再現力にはLステップのタイプがないので、2番目に低い領域のタイプを採用＋「大ミス要注意」
    if(low.id==="shot"){ low = asc[1]; tags.unshift(SHOT_TAG); }
    type = TYPE_BY_DOMAIN[low.id];
  }
  return {dom,total,top3,type,tags};
}

function renderQ(){
  const q = Q[cur];

  </section>`;
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    ans[cur]=+b.dataset.i;

    setTimeout(()=>{ cur++; cur<Q.length?renderQ():renderResult(); window.scrollTo(0,0); },180);

  const back=document.getElementById("back"); if(back) back.onclick=()=>{cur--;renderQ();};
  const home=document.getElementById("home"); if(home) home.onclick=renderStart;
}
